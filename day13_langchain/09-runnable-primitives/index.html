nce. Their plates meet at the pass and become one tray."}, "w": {"what": "Four bricks: RunnableParallel (fork), RunnablePassthrough (copy input), RunnableLambda (your function), itemgetter (pick a key).", "why": "Real apps need branches, copies and custom code inside a chain.", "when": "When you need two answers from the same input, or a custom cleaning function.", "where": "Imported from <code>langchain_core.runnables<\/code> and <code>operator<\/code>.", "how": "1) dict or RunnableParallel for branches 2) RunnablePassthrough to keep input 3) RunnableLambda to wrap a function 4) itemgetter to pick keys."}, "remember": "A plain dict inside a chain becomes a RunnableParallel.", "quiz": [{"q": "What does a plain dict inside a chain become?", "o": ["A string", "A RunnableParallel", "An error"], "a": 1, "why": "It runs the branches in parallel and returns a dict. 🍴"}, {"q": "Which brick runs your own Python function?", "o": ["RunnablePassthrough", "RunnableLambda", "itemgetter"], "a": 1, "why": "RunnableLambda wraps any function."}], "files": [{"name": "main.py", "code": "from operator import itemgetter\nfrom dotenv import load_dotenv\nfrom langchain_core.output_parsers import StrOutputParser\nfrom langchain_core.prompts import ChatPromptTemplate\nfrom langchain_core.runnables import RunnableLambda, RunnableParallel, RunnablePassthrough\nfrom langchain_openai import ChatOpenAI\n\nload_dotenv()\nllm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)\n\ndef make(instr):\n    return ChatPromptTemplate.from_template(instr + \" the movie {movie}.\") | llm | StrOutputParser()\n\n# Fork: three answers from one input\npanel = RunnableParallel(\n    praise=make(\"Write a 1-line praise review for\"),\n    criticism=make(\"Write a 1-line criticism for\"),\n    verdict=make(\"Give a one-word verdict for\"),\n)\n\ndef show(d: dict) -> str:\n    return \"\\n\".join(f\"== {k.upper()} ==\\n{v}\" for k, v in d.items())\n\nprint((panel | RunnableLambda(show)).invoke({\"movie\": \"Inception\"}))\n\n# Passthrough: keep the question and add its length\ndemo = RunnableParallel(question=RunnablePassthrough(), length=lambda x: len(x[\"question\"]))\nprint(demo.invoke({\"question\": \"hello\"}))\n\n# itemgetter: pick one key from a larger input\npick = {\"topic\": itemgetter(\"subject\")} | ChatPromptTemplate.from_template(\"Write a haiku about {topic}\") | llm | StrOutputParser()\nprint(pick.invoke({\"subject\": \"rain\", \"extra\": \"ignored\"}))"}], "run": {"folder": "09_runnable_primitives", "py": "python main.py", "visits": [["python main.py", "== PRAISE ==  /  == CRITICISM ==  /  == VERDICT ==  and a haiku"]]}, "prev": {"num": 8, "file": "../08-lcel-runnables/index.html", "title": "LCEL & the Pipe Operator", "emoji": "🧱", "tagline": "Snap steps together with | like Lego bricks. Every brick speaks invoke.", "group": "🔗 Chains"}, "next": {"num": 10, "file": "../10-streaming/index.html", "title": "Streaming & Batching", "emoji": "📺", "tagline": "Show the answer as it is written, or process many inputs in one call.", "group": "🔗 Chains"}}
