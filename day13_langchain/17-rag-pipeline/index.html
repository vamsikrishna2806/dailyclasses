moryVectorStore(OpenAIEmbeddings(model=\"text-embedding-3-small\"))\nstore.add_documents(chunks)\nretriever = store.as_retriever(search_kwargs={\"k\": 2})\n\n# 2-4. Retrieve, augment, generate\nprompt = ChatPromptTemplate.from_messages([\n    (\"system\", \"Answer ONLY from the context. If it is not there, say you do not know.\\n\\nContext:\\n{context}\"),\n    (\"human\", \"{question}\"),\n])\n\ndef format_docs(docs):\n    return \"\\n\\n\".join(d.page_content for d in docs)\n\nrag = (\n    {\"context\": retriever | format_docs, \"question\": RunnablePassthrough()}\n    | prompt\n    | ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)\n    | StrOutputParser()\n)\n\nprint(rag.invoke(\"How many leave days do I get?\"))\nprint(rag.invoke(\"What is the capital of France?\"))  # should say it does not know"}], "run": {"folder": "17_rag_pipeline", "py": "python main.py", "visits": [["python main.py", "You get 20 days of paid leave…  /  I do not know"]]}, "prev": {"num": 16, "file": "../16-retrievers/index.html", "title": "Retrievers", "emoji": "🧑‍🏫", "tagline": "Give a question, get the best matching documents back. Every store can become one.", "group": "📚 Documents & RAG"}, "next": {"num": 18, "file": "../18-tools/index.html", "title": "Tools & Function Calling", "emoji": "🔧", "tagline": "Give the model hands: it asks for your Python function, and your code runs it.", "group": "🤖 Tools & agents"}}
